name: ZEUS comic image translation
on:
  push:
    branches: [main, feature/zeus-manhwa-translation-20261101]
    paths: ['ZEUSNext/**', 'ZEUSNextTests/**', 'Native/ComicRuntime/**', '.zeus-ci/**', '.openminis/Host/NativeComicTranslationTests.swift', '.github/workflows/zeus-comic-translation.yml']
  pull_request:
    paths: ['ZEUSNext/**', 'ZEUSNextTests/**', 'Native/ComicRuntime/**', '.zeus-ci/**', '.openminis/Host/NativeComicTranslationTests.swift', '.github/workflows/zeus-comic-translation.yml']
  workflow_dispatch:
    inputs:
      run_live_comix_smoke:
        description: Run the public Comix chapter smoke test with a local translation fixture
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: zeus-comic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix .zeus-ci/comic
      - run: node --test .zeus-ci/comic/bridge.test.mjs
      - run: python3 .zeus-ci/comic/compare_test.py
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y libjpeg-dev libpng-dev libwebp-dev
      - run: python3 -m pip install pillow==11.3.0
      - run: g++ -std=c++17 -shared -fPIC Native/ComicRuntime/ComicRegionDecoder.cpp -o /tmp/libcomicdecoder.so $(pkg-config --cflags --libs libjpeg libpng libwebp)
      - run: python3 .zeus-ci/comic/decoder.test.py /tmp/libcomicdecoder.so
  ios:
    runs-on: macos-15
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphonesimulator, iphoneos]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Parse Swift before compiling native dependencies
        run: xcrun swiftc -frontend -parse ZEUSNext/ComicTranslation/*.swift .openminis/Host/NativeComicTranslationTests.swift
      - name: Install build tools
        run: brew install xcodegen ninja cmake cocoapods
      - name: Compile pinned local GGUF runtime
        run: bash .zeus-ci/comic/build_runtime.sh '${{ matrix.sdk }}'
      - name: Generate test application
        run: |
          python3 .zeus-ci/project.py
          xcodegen generate --spec zeus-project.json
          mkdir -p results
      - name: Install device-only ML Kit SDKs
        if: matrix.sdk == 'iphoneos'
        run: |
          ruby .zeus-ci/comic/install_pods.rb ZEUSNext.xcodeproj ZEUSNext
          pod install
      - name: Compile device with actual ML Kit and ONNX
        if: matrix.sdk == 'iphoneos'
        run: |
          set -o pipefail
          xcodebuild -workspace ZEUSNext.xcworkspace -scheme ZEUSNext -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ZeusComicDevice" build CODE_SIGNING_ALLOWED=NO 2>&1 | tee results/device.log
      - name: Select simulator
        if: matrix.sdk == 'iphonesimulator'
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          types=json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))['devicetypes']
          sdk=subprocess.check_output(['xcrun','--sdk','iphonesimulator','--show-sdk-version'],text=True).strip()
          suffix='iOS-'+'.'.join(sdk.split('.')[:2]).replace('.','-')
          matches=[(runtime,device) for runtime,group in devices.items() if runtime.endswith(suffix) for device in group if 'iPhone' in device['name']]
          if not matches: raise SystemExit('No iPhone simulator matches the active iOS SDK '+sdk)
          runtime,device=matches[0]
          type_id=device.get('deviceTypeIdentifier') or next(t['identifier'] for t in types if t['name']==device['name'])
          name='ZEUS-Comic-'+os.environ['GITHUB_RUN_ID']
          identifier=subprocess.check_output(['xcrun','simctl','create',name,type_id,runtime],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('COMIC_SIMULATOR='+identifier+'\n')
          PY
      - name: Boot selected simulator before tests
        if: matrix.sdk == 'iphonesimulator'
        timeout-minutes: 12
        run: |
          xcrun simctl boot "$COMIC_SIMULATOR" || true
          if ! xcrun simctl bootstatus "$COMIC_SIMULATOR" -b; then
            echo "boot attempt failed once; shutting down and retrying"
            xcrun simctl shutdown "$COMIC_SIMULATOR" || true
            sleep 10
            xcrun simctl boot "$COMIC_SIMULATOR" || true
            xcrun simctl bootstatus "$COMIC_SIMULATOR" -b
          fi
      - name: Start deterministic provider fixture
        if: matrix.sdk == 'iphonesimulator'
        env:
          ZEUS_RUN_COMIX_LIVE_SMOKE: ${{ inputs.run_live_comix_smoke }}
        run: |
          python3 .zeus-ci/fixture_server.py > results/fixture.log 2>&1 &
          curl --fail --max-time 5 --retry 10 --retry-connrefused http://127.0.0.1:8765/ > /dev/null
      - name: Test actual WebKit bridge and pixel rendering
        timeout-minutes: 20
        if: matrix.sdk == 'iphonesimulator'
        run: |
          set -euo pipefail
          if [ "${{ inputs.run_live_comix_smoke }}" = "true" ]; then DEFAULT_TEST_ALLOWANCE=180; MAX_TEST_ALLOWANCE=240; else DEFAULT_TEST_ALLOWANCE=90; MAX_TEST_ALLOWANCE=120; fi
          set -o pipefail
          xcodebuild -project ZEUSNext.xcodeproj -scheme ZEUSNext -sdk iphonesimulator -destination "platform=iOS Simulator,id=$COMIC_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/ZeusComicSim" -resultBundlePath results/comic.xcresult -only-testing:ZEUSNextTests/NativeComicTranslationTests -only-testing:ZEUSNextTests/BrowserCoreTests/testPersistKeepsPrimaryTabWhenSecondaryPaneIsFocused -only-testing:ZEUSNextTests/BrowserCoreTests/testGalleryImageDownloadEnforcesSizeLimitBeforeAndDuringTransfer -only-testing:ZEUSNextTests/BrowserCoreTests/testAIImageAttachmentRejectsExcessivePixelCountsAndDimensions -only-testing:ZEUSNextTests/BrowserCoreTests/testAIAttachmentRejectsOversizedFileBeforeImageInspection -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance "$DEFAULT_TEST_ALLOWANCE" -maximum-test-execution-time-allowance "$MAX_TEST_ALLOWANCE" test CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | python3 -u .zeus-ci/redact_ci_log.py | tee results/simulator.log
      - name: Collect simulator diagnostics
        if: always() && matrix.sdk == 'iphonesimulator'
        timeout-minutes: 2
        continue-on-error: true
        run: |
          if [ "${{ inputs.run_live_comix_smoke }}" != "true" ]; then xcrun simctl io "$COMIC_SIMULATOR" screenshot results/simulator.png || true; else echo 'Screenshot omitted for live chapter privacy.'; fi
          xcrun simctl spawn "$COMIC_SIMULATOR" launchctl list > results/processes.log || true
          if [ "${{ inputs.run_live_comix_smoke }}" = "true" ]; then echo 'System log omitted for live chapter URL privacy.' > results/system.log; else xcrun simctl spawn "$COMIC_SIMULATOR" log show --last 8m --style compact --predicate 'process == "ZEUSNext" OR process == "xctest" OR subsystem CONTAINS "testmanager"' > results/system.log || true; fi
      - name: Export exact revision and result summary
        if: always()
        run: |
          mkdir -p results
          git rev-parse HEAD > results/source-commit.txt
          if [ -f results/comic.xcresult/Info.plist ]; then
            xcrun xcresulttool get test-results summary --path results/comic.xcresult | python3 .zeus-ci/redact_ci_log.py > results/summary.json || echo '{"result":"summary unavailable"}' > results/summary.json
          fi
          if [ "${{ inputs.run_live_comix_smoke }}" = "true" ]; then rm -rf results/comic.xcresult; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeus-comic-${{ matrix.sdk }}
          path: results
          retention-days: 14
